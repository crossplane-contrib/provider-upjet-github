---
apiVersion: repo.github.upbound.io/v1alpha1
kind: Repository
metadata:
  name: github-crossplane-dependabot-secret
spec:
  forProvider:
    visibility: public
    autoInit: true
    gitignoreTemplate: Terraform
  providerConfigRef:
    name: default
---
apiVersion: dependabot.github.upbound.io/v1alpha1
kind: DependabotSecret
metadata:
  name: dependabot-secret-test
spec:
  forProvider:
    secretName: TEST_SECRET
    repositoryRef:
      name: github-crossplane-dependabot-secret
    plaintextValueSecretRef:
      key: howdy
      name: dependabot-secret-secret
      namespace: default
  providerConfigRef:
    name: default
---
apiVersion: dependabot.github.upbound.io/v1alpha1
kind: DependabotOrganizationSecret
metadata:
  name: dependabot-organization-secret-test
spec:
  forProvider:
    secretName: TEST_ORG_SECRET
    visibility: private
    plaintextValueSecretRef:
      key: howdy
      name: dependabot-secret-secret
      namespace: default
  providerConfigRef:
    name: default
---
apiVersion: v1
kind: Secret
metadata:
  name: dependabot-secret-secret
stringData:
  howdy: a-secret-text
