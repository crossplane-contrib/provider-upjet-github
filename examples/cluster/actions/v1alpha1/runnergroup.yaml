apiVersion: actions.github.upbound.io/v1alpha1
kind: RunnerGroup
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/runnergroup
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example-runner-group
    selectedRepositoryIds:
    - 123456789 # a repository's numeric ID: what a Repository reports as status.atProvider.repoId
    visibility: selected

---

apiVersion: repo.github.upbound.io/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/runnergroup
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: my-repository
