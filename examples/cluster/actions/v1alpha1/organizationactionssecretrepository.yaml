apiVersion: actions.github.upbound.io/v1alpha1
kind: OrganizationActionsSecretRepository
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/organizationactionssecretrepository
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    repositoryId: 123456789 # a repository's numeric ID: what a Repository reports as status.atProvider.repoId
    secretNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: actions.github.upbound.io/v1alpha1
kind: OrganizationActionsSecret
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/organizationactionssecretrepository
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    plaintextValueSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    secretName: mysecret
    visibility: selected

---

apiVersion: repo.github.upbound.io/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/organizationactionssecretrepository
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: myrepo
    visibility: public
