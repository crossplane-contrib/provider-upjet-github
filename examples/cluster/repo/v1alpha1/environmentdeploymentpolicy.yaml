apiVersion: repo.github.upbound.io/v1alpha1
kind: EnvironmentDeploymentPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: repo/v1alpha1/environmentdeploymentpolicy
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    branchPattern: releases/*
    environmentSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    repositorySelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: repo.github.upbound.io/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: repo/v1alpha1/environmentdeploymentpolicy
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: example-environment-deployment-policy

---

apiVersion: repo.github.upbound.io/v1alpha1
kind: Environment
metadata:
  annotations:
    meta.upbound.io/example-id: repo/v1alpha1/environmentdeploymentpolicy
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    deploymentBranchPolicy:
    - customBranchPolicies: true
      protectedBranches: false
    environment: environment/test
    repositorySelector:
      matchLabels:
        testing.upbound.io/example-name: test
    reviewers:
    - users:
      - 1234567 # a GitHub user's numeric ID
    waitTimer: 10000
