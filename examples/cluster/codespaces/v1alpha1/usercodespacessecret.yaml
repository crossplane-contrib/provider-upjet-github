apiVersion: codespaces.github.upbound.io/v1alpha1
kind: UserCodespacesSecret
metadata:
  annotations:
    meta.upbound.io/example-id: codespaces/v1alpha1/usercodespacessecret
  labels:
    testing.upbound.io/example-name: example_secret
  name: example-secret
spec:
  forProvider:
    plaintextValueSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    secretName: example_secret_name
    selectedRepositoryIds:
    - 123456789 # a repository's numeric ID: what a Repository reports as status.atProvider.repoId
