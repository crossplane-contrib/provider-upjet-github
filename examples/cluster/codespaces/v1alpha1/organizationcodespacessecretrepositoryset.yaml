apiVersion: codespaces.github.upbound.io/v1alpha1
kind: OrganizationCodespacesSecretRepositorySet
metadata:
  annotations:
    meta.upbound.io/example-id: codespaces/v1alpha1/organizationcodespacessecretrepositoryset
  labels:
    testing.upbound.io/example-name: org_secret_repos
  name: org-secret-repos
spec:
  forProvider:
    secretNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    selectedRepositoryIds:
    - 123456789 # a repository's numeric ID: what a Repository reports as status.atProvider.repoId
