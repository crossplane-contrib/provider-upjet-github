apiVersion: dependabot.github.upbound.io/v1alpha1
kind: DependabotOrganizationSecret
metadata:
  annotations:
    meta.upbound.io/example-id: dependabot/v1alpha1/dependabotorganizationsecret
  labels:
    testing.upbound.io/example-name: example_plaintext
  name: example-plaintext
spec:
  forProvider:
    plaintextValueSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    secretName: example_secret_name
    visibility: all
