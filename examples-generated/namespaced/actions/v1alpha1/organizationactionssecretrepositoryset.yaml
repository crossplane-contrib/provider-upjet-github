apiVersion: actions.github.m.upbound.io/v1alpha1
kind: OrganizationActionsSecretRepositorySet
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/organizationactionssecretrepositoryset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    secretNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    selectedRepositoryIds:
    - ${github_repository.example.repo_id}

---

apiVersion: actions.github.m.upbound.io/v1alpha1
kind: OrganizationActionsSecret
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/organizationactionssecretrepositoryset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    plaintextValueSecretRef:
      key: example-key
      name: example-secret
    secretName: mysecret
    visibility: selected

---

apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/organizationactionssecretrepositoryset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: myrepo
    visibility: public
